    <!-- ========== 1. 在线人数 HTML代码 ========== -->
    
        <!-- 在线人数显示 -->
        <div class="online-counter" id="onlineCounter">
            <div class="online-dot"></div>
            <span class="online-text">当前在线</span>
            <span class="online-number" id="onlineNumber">1800
			</span>
        </div>
    
    
    <!-- ========== 2. 实时提现 HTML代码 ========== -->
    
 
    
    <!-- ========== JavaScript 功能代码 ========== -->
    <script>
        // ========== 在线人数动态更新 ==========
        let currentOnline = 1912;
        const onlineNumberEl = document.getElementById('onlineNumber');
        
        function updateOnlineNumber() {
            // 随机增减人数（模拟真实波动）
            const change = Math.floor(Math.random() * 50) - 20;
            currentOnline += change;
            // 保持在合理范围
            if (currentOnline < 800) currentOnline = 800;
            if (currentOnline > 5000) currentOnline = 5000;
            
            // 添加跳动动画
            onlineNumberEl.classList.add('jump');
            setTimeout(() => {
                onlineNumberEl.classList.remove('jump');
            }, 400);
            
            // 格式化数字
            onlineNumberEl.textContent = currentOnline.toLocaleString();
        }
        
        // 每3秒更新一次在线人数
        setInterval(updateOnlineNumber, 3000);
        
        // ========== 实时提现滚动墙系统 ==========
        const rewardScrollContent = document.getElementById('rewardScrollContent');
        const rewardNames = ['张**老板', '李**老板', '王**老板', '刘**老板', '陈**老板', '杨**老板', '赵**老板', '黄**老板', '周**老板', '吴**老板'];
        const rewardAmounts = ['¥1,888', '¥3,888', '¥5,888', '¥8,888', '¥10,000', '¥18,888', '¥28,888', '¥66,666'];
        const rewardActions = ['刚提现', '中奖', '充值', '赢得'];
        
        function generateRewardItems() {
            let html = '';
            // 生成10条数据（5条显示，5条用于循环）
            for (let i = 0; i < 10; i++) {
                const randomName = rewardNames[Math.floor(Math.random() * rewardNames.length)];
                const randomAmount = rewardAmounts[Math.floor(Math.random() * rewardAmounts.length)];
                const randomAction = rewardActions[Math.floor(Math.random() * rewardActions.length)];
                html += `
                    <div class="reward-item">
                        <span class="reward-icon-small">🎉</span>
                        <span class="reward-user">${randomName}</span>
                        <span class="reward-action">${randomAction}</span>
                        <span class="reward-money">${randomAmount}</span>
                    </div>
                `;
            }
            rewardScrollContent.innerHTML = html;
        }
        
        // 初始化生成奖励条目
        generateRewardItems();
        
        // 每5秒更新一条数据
        function updateRewardItem() {
            const items = rewardScrollContent.querySelectorAll('.reward-item');
            const randomIndex = Math.floor(Math.random() * items.length);
            const randomName = rewardNames[Math.floor(Math.random() * rewardNames.length)];
            const randomAmount = rewardAmounts[Math.floor(Math.random() * rewardAmounts.length)];
            const randomAction = rewardActions[Math.floor(Math.random() * rewardActions.length)];
            
            items[randomIndex].innerHTML = `
                <span class="reward-icon-small">🎉</span>
                <span class="reward-user">${randomName}</span>
                <span class="reward-action">${randomAction}</span>
                <span class="reward-money">${randomAmount}</span>
            `;
        }
        
        setInterval(updateRewardItem, 5000);
        
    </script>
