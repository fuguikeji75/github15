<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon" />
    <link rel="maskicon" href="/favicon.x-icon" />
    <link rel="apple-touch-icon" href="/favicon.x-icon" />
    <title>新濠集团</title>
    <style>
        /** 样式重置 */
        body, html, h1, h2, h3, h4, h5, h6, ul, ol, li, dl, dt, dd, header, menu, section, p, input, td, th, ins {
            padding: 0; margin: 0;
        }
        ul, ol, li { list-style: none; }
        a { text-decoration: none; color: #666; }
        a:hover { color: #666; text-decoration: underline; }
        i, em { font-style: normal; }
        input, textarea, button, select, a { outline: none; border: none; }
        table { border-collapse: collapse; border-spacing: 0; }
        img { border: none; vertical-align: middle; }
        body, textarea, select, input, button {
            font-size: 12px; color: #333; font-family: Arial, Helvetica, sans-serif; background-color: #f5f5f5;
        }
        body { overflow-x: hidden; }

        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }

        .home {
            width: 100%; min-height: 100vh;
            background-image: url("./img/bg.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        .ball {
            width: 100px; height: 100px; cursor: pointer; position: fixed;
            display: flex; justify-content: center; align-items: center;
            background: url("./img/Group 1627.png") no-repeat center center;
            background-size: contain;
            top: 85%; left: 82%; bottom: 0%; width: 50px; height: 50px;
        }

        .home { width: 100%; }
        .home .home-top {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
        }
        .home .home-top .left {
            height: 100%; display: flex; flex-direction: column; justify-content: space-between;
        }
        .home .home-top .left .top { width: 236.43px; height: 223px; }
        .home .home-top .left .center { width: 216.88px; height: 210px; }
        .home .home-top .left .footer { width: 195px; height: 205px; }
        .home .home-top .center { width: 841px; height: 473.74px; }
        .home .home-top .right { display: flex; position: relative; }
        .home .home-top .right .big { width: 557.39px; height: 608px; }
        .home .home-top .right .ball { position: relative; right: 80px; margin-top: 120px; width: 198px; height: 198px; }

        .home .home-content {
            width: 95%; display: flex; flex-direction: column; align-items: center;
            margin: 0 auto; position: relative;
        }
        .home .home-content .box {
            margin-top: -27px; width: 100%; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center;
        }
        .home .home-content .box .left, .box-right { height: 140px; width: 100%; }
        .home .home-content .box .left {
            width: 100%; height: auto; margin: 8px 0;
        }
        .home .home-content .box .box-right {
            cursor: pointer; width: 100%; height: auto;
        }
        .home .home-content .box .box-right img { width: 100%; }
        .home .home-content .box .box-right .top { color: #553d18; }
        .home .home-content .box .box-right .cont { color: #ff0000; }
        .home .home-content .box .box-right .cont .text { color: #553d18; }
        .home .home-content .box .box-right .footer {
            display: flex; flex-direction: row; align-items: center;
            justify-content: center; width: 100%;
        }
        .home .home-content .box .box-right .footer .btn {
            cursor: pointer; width: 121px; height: 44px;
            background: linear-gradient(180deg, #fb3d3d 0%, #8c1818 100%);
            border-radius: 25px; color: #fff; font-size: 26px;
            display: flex; justify-content: center; align-items: center;
        }
        .home .home-content .box .box-right .footer .btn:last-child { margin-left: 20px; }

        .list {
            width: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .list .list-box {
            width: 100%; display: flex; justify-content: space-around;
            align-items: center; margin-bottom: 5px; transform: scale(0.95);
            position: relative;
        }
        .list .list-box .btns {
            position: absolute; bottom: 8%; left: -4%; width: 100%;
            display: flex; justify-content: flex-end; z-index: 1000;
        }
        .list .list-box .btns img { height: 27px; }
        .list .list-box .btns img:first-child { margin-right: 3%; }
        .list .list-box .imgs { width: 100%; height: 100%; }
        .list .list-box .desc {
            width: 50%; height: 262px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-around; color: #fff; flex-shrink: 1;
        }
        .list .list-box .desc .imgP { width: 85px; height: 85px; border-radius: 50%; }
        .list .list-box .desc .room-text {
            cursor: pointer; height: 48px; font-size: 18px;
            display: flex; align-items: center;
        }
        .list .list-box .desc .room-text .box {
            padding: 5px 10px; display: flex; justify-content: center;
            align-items: center; border-radius: 11px; background: #8d5603;
        }
        .list .list-box .desc .three {
            cursor: pointer; font-size: 13px; display: flex; align-items: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .list .list-box .desc .three .img { width: 15px; height: 21px; }
        .list .list-box .desc .three text { color: #f9d799; }
        .list .list-box .desc .four {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            cursor: pointer; padding: 10px 10px; border-radius: 25px;
            font-size: 8px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(90deg, #fae2aa 0%, #f5bb63 100%);
        }
        .list .list-box .desc .btns {
            cursor: pointer; width: 100%; display: flex; justify-content: space-around;
            align-items: center; font-size: 24px; position: absolute;
            top: 0; bottom: 0; right: 20px;
        }
        .list .list-box .desc .btn {
            border-radius: 55px; display: flex; justify-content: center;
            align-items: center; border: 2px solid #fff; font-size: 12px; padding: 5px 10px;
        }
        .list .list-box .desc .btn1 {
            background: linear-gradient(0deg, #8d5603 0%, #e0a246 100%);
        }

        .footer {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .footer .img { width: 65%; display: flex; justify-content: space-between; }
        .footer .img img { width: 100%; margin-bottom: 30px; margin-left: 8px; }
        .footer .box {
            width: 95%; display: flex; flex-wrap: wrap; gap: 21px;
        }
        .footer .box .box-item {
            width: 47%; height: 218px; background: #402d14; color: #f3cd94;
            font-size: 18px; display: flex; flex-direction: column;
            border-radius: 16px; cursor: pointer;
            box-shadow: 0px -8px 15px 3px #ffb73ab5 inset;
        }
        .footer .box .box-item .text { font-size: 14px; padding: 10px; }
        .footer .box .box-item img { margin-left: 60px; margin-top: 5px; }
        .footer .desc {
            margin-top: 30px; font-weight: 600; font-size: 12px;
            margin-bottom: 20px; color: #fff; opacity: 0.5;
        }
    </style>
    <script type="text/javascript">
        (function(w, d) {
            function setSize() {
                var screenWidth = d.documentElement.clientWidth;
                if (screenWidth > 960) { screenWidth = 960; }
                var currentFontSize = (screenWidth * 100) / 750;
                d.documentElement.style.fontSize = currentFontSize + "px";
            }
            w.addEventListener("resize", setSize);
            w.addEventListener("pageShow", setSize);
            w.addEventListener("DOMContentLoaded", setSize);
        })(window, document);
    </script>
</head>
<body>
    <div class="home">
        <div id="topImg" class="home-top">
            <div class="swiper">
                <div id="wrapper" class="swiper-wrapper"></div>
            </div>
        </div>
        <section id="Hcontent" class="home-content">
            <article id="contTitle" class="title">集团介绍</article>
            <section id="contbox" class="box" onclick="handleOpenUrl()"></section>
        </section>
        <div id="list" class="list">
            <div id="four5" class="list-box" onclick="handleWebsite('https://www.mjweb202.xyz/?roomNum=607447')"></div>
            <div id="four4" class="list-box" onclick="handleWebsite('https://www.mjweb202.xyz/?roomNum=659979')"></div>
            <div id="four" class="list-box" onclick="handleWebsite('https://1689437.com/')"></div>
            <div id="four1" class="list-box" onclick="handleWebsite('https://beyond.kxqmquj.cc/')"></div>

        </div>
        <div class="footer">
            <div class="img">
                <img src="./img/Group 1566.png" alt="footer" />
            </div>
            <div id="footerBox" class="box"></div>
            <div class="desc">Copyright © 2026 新濠集团. All Rights Reserved.</div>
        </div>
    </div>

    <div class="ball" onclick="handleService()"></div>

    <script>
        const footerListArr = [
            { id: 0, img: "./img/1.png", text: "多群矩阵同步运营，信赖保证" },
            { id: 1, img: "./img/2.png", text: "客服团队全时在线，问题实时响应" },

            { id: 3, img: "./img/4.png", text: "实时数据，公平公正" }
        ];

        const footerHtml = footerListArr.map((item) =>
            `<div class="box-item">
                <div class="text">${item.text}</div>
                <img class="img" src="${item.img}" alt="" />
            </div>`
        ).join("");

        document.getElementById("footerBox").innerHTML = `<img style="width:100%" src="./img/h5footers.png" alt="" />`;
        document.getElementById("contbox").innerHTML = `<img style="width:100%;cursor: pointer;" src="./img/ust.png" alt="" />`;
        document.getElementById("topImg").innerHTML = `<img style="width:100%;height:100%" src="./img/h5t.png" alt="" />`;


        document.getElementById("four4").innerHTML = `
            <img class="imgs" src="./img/l9.png" alt="" />
            <div class="btns">
                <img src="./img/lr.png">
                <img onclick="handleWebsite('https://www.168mj.app/')" src="./img/ld.png">
            </div>`;
        document.getElementById("four5").innerHTML = `
            <img class="imgs" src="./img/l10.png" alt="" />
            <div class="btns">
                <img src="./img/lr.png">
                <img onclick="handleWebsite('https://www.168mj.app/')" src="./img/ld.png">
            </div>`;
        document.getElementById("four").innerHTML = `
            <img class="imgs" src="./img/l7.png" alt="" />
            <div class="btns">
                <img src="./img/lr1.png">
                <img onclick="handleWebsite('https://www.168mj.app/')" src="./img/ld.png">
            </div>`;
        document.getElementById("four1").innerHTML = `
            <img class="imgs" src="./img/l8.png" alt="" />
            <div class="btns">
                <img src="./img/lr2.png">
                <img onclick="handleWebsite('https://www.168mj.app/')" src="./img/ld.png">
            </div>`;
        
        const el = document.getElementById("Hcontent");
        const child = document.getElementById("contTitle");
        document.getElementById("contbox").innerHTML = `
            <div class="left"><img style="width:100%" src="./img/h5123.png" alt="" /></div>
            `;
        el.removeChild(child);

        function handleWebsite(website) {
            event.stopPropagation();
            window.open(website, "_blank");
        }

        function handleOpenUrl() {
            window.open("https://tronscan.org/", "_blank");
        }

        function handleService() {
            window.open("https://tawk.to/chat/6a34c1b2a259a01d4cf7564d/1jrf198qi", "_blank");
        }
    </script>

</body>
</html>
